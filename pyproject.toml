[project]
name = "fuelpricesgr"
version = "0.1.0"
description = "A database of fuel prices in Greece"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi~=25.1.0",
    "boto3~=1.43.123",
    "cachelib~=0.17.0",
    "environs~=15.2.0",
    "fastapi~=0.162.0",
    "greenlet~=3.5.0",
    "gunicorn~=26.2.0",
    "itsdangerous~=2.2.0",
    "matplotlib~=3.11.0",
    "pydantic~=2.14.0",
    "pypdf~=6.21.0",
    "python-dateutil<3.0.0", # restricted by boto3
    "requests~=2.34.0",
    "sqladmin~=0.32.0",
    "sqlalchemy~=2.1.0",
    "starlette~=1.10.0",
    "uvicorn~=0.54.0",
    "uvicorn-worker>=0.4.0",
]

[dependency-groups]
dev = [
    "coverage~=7.17.0",
    "factory-boy~=3.3.0",
    "httpx2~=2.16.0",
    "pylint~=4.1.0",
    "pytest~=9.2.0",
    "safety~=3.8.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg~=3.3.0",
    "psycopg-binary~=3.3.0"
]

mysql = [
    "pymysql~=1.2.0"
]

mongo = [
    "pymongo~=4.19.0"
]
